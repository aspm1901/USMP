<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta | Gestión Curricular USMP FIA</title>
  <link rel="icon" type="image/png" href="./logousmp.png?v=3">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="./assets/css/styles.css?v=13">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-mark" src="./logousmp.png" alt="Logo USMP FIA">
        <div>
          <h1 class="page-title">Encuesta Curricular USMP FIA</h1>
          <p class="page-subtitle">Participación de estudiantes, egresados y docentes</p>
        </div>
      </div>
    </div>
  </header>

  <main class="page survey-page">
    <section id="surveyAlert" class="alert is-visible">
      <strong>Encuesta:</strong>
      <span id="surveyMessage">Cargando preguntas.</span>
    </section>

    <section class="panel survey-panel">
      <div class="hero">
        <div class="hero-row">
          <div>
            <h2>Formulario de feedback curricular</h2>
            <p class="reason">Tus respuestas ayudan a identificar carreras, cursos y aspectos del plan de estudios que necesitan actualización o mayor apoyo.</p>
          </div>
          <span class="badge status-en-curso">Registro público</span>
        </div>
      </div>

      <form id="surveyForm" class="survey-form">
        <div class="section-grid">
          <div class="field">
            <label for="surveyEmail">Correo institucional</label>
            <input id="surveyEmail" name="correo_institucional" type="email" placeholder="usuario@usmp.pe" pattern="^[^@\s]+@usmp\.pe$" required>
          </div>
          <div class="field">
            <label for="surveyPlan">Carrera / plan</label>
            <select id="surveyPlan" name="id_plan" required></select>
          </div>
          <div class="field">
            <label for="surveyPopulation">Participante</label>
            <select id="surveyPopulation" name="id_poblacion" required></select>
          </div>
        </div>

        <div id="questionList" class="question-list"></div>

        <div class="form-actions">
          <button id="surveySubmit" class="btn" type="submit">Enviar respuestas</button>
        </div>
      </form>
    </section>
  </main>

  <script src="./assets/js/survey.js?v=13"></script>
</body>
</html>
